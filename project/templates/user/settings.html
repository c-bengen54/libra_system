{% extends "base.html" %}

{% block title %}
Settings
{% endblock %}

{% block content %}
<div class="card card-small">
    <div class="logo">
        LibraSystem®
        <span class="logo-dot"></span>
    </div>

    <p class="subtitle">Account settings</p>

    <div class="profile-row">
        <span class="key">First name</span>
        <span class="val">{{ member[3] }}</span>
    </div>

    <div class="profile-row">
        <span class="key">Last name</span>
        <span class="val">{{ member[4] }}</span>
    </div>

    <div class="profile-row">
        <span class="key">Email</span>
        <span class="val">{{ member[5] }}</span>
    </div>

    <form method="POST">
        <input type="hidden" name="action" value="profile">

        <div class="field">
            <label for="field">Field to update</label>
            <select id="field" name="field" required>
                <option value="first_name">First name</option>
                <option value="last_name">Last name</option>
                <option value="email">Email</option>
            </select>
        </div>

        <div class="field">
            <label for="value">New value</label>
            <input type="text" id="value" name="value" placeholder="Enter new value" required>
        </div>

        <button class="btn" type="submit">Update Info</button>
    </form>

    <form method="POST">
        <input type="hidden" name="action" value="password">

        <div class="field">
            <label for="current_password">Current password</label>
            <input type="password" id="current_password" name="current_password" required>
        </div>

        <div class="field">
            <label for="new_password">New password</label>
            <input type="password" id="new_password" name="new_password" required>
        </div>

        <button class="btn" type="submit">Change Password</button>
    </form>

    <span class="footer-link"><a href="{{ url_for('account.dashboard') }}">← Back to Dashboard</a></span>
</div>
{% endblock %}
