services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: lms
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./project/database_setup/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms"]
      interval: 3s
      retries: 10
    ports:
      - 5433:5432

  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://lms:devpassword@db:5432/lms
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: